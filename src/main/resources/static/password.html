<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitly — Password Protected Link</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <style>
        .password-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .password-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeInUp 0.6s ease;
        }
        .password-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(108, 92, 231, 0.1);
            color: var(--accent-light);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        .password-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .password-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .password-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color var(--transition);
        }
        .password-input-wrapper:focus-within .password-input-icon {
            color: var(--accent-light);
        }
        #password-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.03);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: var(--font);
            transition: all var(--transition);
            outline: none;
        }
        #password-input:focus {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.05);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 4px;
            text-align: left;
        }
        .btn-full {
            width: 100%;
            justify-content: center;
            padding: 16px;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="password-body">
        <div class="password-card">
            <div class="password-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1 class="password-title">Link Password Required</h1>
            <p class="password-subtitle">This shortened URL is password-protected. Please enter the password to proceed to your destination.</p>

            <form id="password-form" class="password-form">
                <div class="password-input-wrapper">
                    <svg class="password-input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password-input" placeholder="Enter password..." required autocomplete="off" autofocus maxlength="20">
                </div>
                <div id="error-box" class="error-message hidden"></div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
                    <span>Unlock & Redirect</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('password-form');
        const input = document.getElementById('password-input');
        const submitBtn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-box');

        // Extract short code from URL query parameter 'code'
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (!code) {
            errorBox.textContent = 'Invalid access: missing link code.';
            errorBox.classList.remove('hidden');
            input.disabled = true;
            submitBtn.disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            
            const password = input.value;
            if (!password) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner"></div><span>Verifying...</span>';

            try {
                const res = await fetch(`/api/urls/${code}/resolve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorBox.textContent = data.message || 'Incorrect password. Please try again.';
                    errorBox.classList.remove('hidden');
                    return;
                }

                // Redirect to long URL
                window.location.href = data.originalUrl;
            } catch (err) {
                errorBox.textContent = 'Network error. Please try again.';
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Unlock & Redirect</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
            }
        });
    </script>
</body>
</html>
